name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug :companion:assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "===== COMPILER DIAGNOSTICS ====="
            grep -E "^(e|w): |FAILURE:|What went wrong|^> " build.log | head -200
            echo "===== END DIAGNOSTICS ====="
          fi
          exit $status

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/Nexus-debug.apk"
          cp companion/build/outputs/apk/debug/companion-debug.apk "out/NexusCompanion-debug.apk"
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          # Both APKs ship together: the bridge between them is
          # signature-checked, so a mismatched pair will not connect.
          name: Nexus-debug-apk
          path: out/*.apk
          if-no-files-found: error
