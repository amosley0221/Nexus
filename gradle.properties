org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Signing. Both APKs must carry the SAME signature: Android refuses to update an
# installed app whose signature changed, and the companion's overlay bridge only
# accepts a launcher signed with its own key.
#
# These defaults point at the committed keystore, which exists so every build —
# yours or CI's — produces an updatable APK. Override any of them with the
# matching NEXUS_* environment variable to sign with a private key instead.
nexusKeystoreFile=keystore/nexus.jks
nexusKeystorePassword=nexuslauncher
nexusKeyAlias=nexus
nexusKeyPassword=nexuslauncher
